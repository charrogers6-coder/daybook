<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook — your day, drawn down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F4; --surface:#FFFFFF; --ink:#191C26; --muted:#6A7180;
    --line:#ECE8E2; --line-soft:#F3F0EB;
    --go:#0D9488; --go-ink:#0B6E66;
    --hi:#DC2626; --med:#D97706; --lo:#7C8698;
    --display:'Fraunces',Georgia,serif;
    --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--ui);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  .wrap{max-width:680px; margin:0 auto; padding:0 16px}

  /* ---------- Hero ---------- */
  .hero{
    background:
      radial-gradient(120% 140% at 15% 0%, rgba(234,115,23,.20), transparent 55%),
      radial-gradient(120% 140% at 85% 10%, rgba(219,39,119,.16), transparent 55%),
      linear-gradient(180deg, #FFF7EE 0%, var(--bg) 100%);
    padding:34px 16px 26px; margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .hero-in{max-width:680px; margin:0 auto}
  .date{font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tally{display:flex; align-items:baseline; gap:12px; margin:4px 0 16px; flex-wrap:wrap}
  .tally .n{font-family:var(--display); font-weight:600; font-size:clamp(64px,17vw,104px); line-height:.9; font-optical-sizing:auto; letter-spacing:-.02em}
  .tally .lbl{font-family:var(--display); font-size:clamp(24px,6vw,34px); color:var(--muted); font-weight:400}
  .tally .lbl.allclear{color:var(--go-ink); font-weight:500}
  .meter{height:12px; background:#EFE7DC; border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
  .meter>span{display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#F59E0B,#EA7317 45%,#DB2777);
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  .meter-cap{margin-top:9px; font-size:14px; color:var(--muted); font-weight:500}

  /* ---------- Add ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px}
  .add{padding:16px; margin:16px 0 14px; box-shadow:0 6px 20px rgba(80,60,30,.05)}
  .add-row{display:flex; gap:10px; align-items:center}
  input,select,button,textarea{font-family:var(--ui); font-size:16px; color:var(--ink)}
  .add input.task-text{flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:19px; padding:8px 2px; font-weight:500}
  .add input.task-text::placeholder{color:#AEB4BD; font-weight:400}
  .meta-row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center}
  select,.tag-input{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface); outline:none; color:var(--ink); font-weight:500}
  .tag-input{flex:1; min-width:150px; font-weight:400}
  .tag-input::placeholder{color:#AEB4BD}
  .pri-seg{display:inline-flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
  .pri-seg button{border:none; background:var(--surface); padding:10px 14px; cursor:pointer; font-size:14px; color:var(--muted); font-weight:600}
  .pri-seg button+button{border-left:1.5px solid var(--line)}
  .pri-seg button[aria-pressed="true"][data-p="High"]{background:var(--hi); color:#fff}
  .pri-seg button[aria-pressed="true"][data-p="Medium"]{background:var(--med); color:#fff}
  .pri-seg button[aria-pressed="true"][data-p="Low"]{background:var(--lo); color:#fff}
  .add-btn{border:none; background:var(--go); color:#fff; font-weight:700; cursor:pointer; border-radius:12px; padding:11px 22px; font-size:16px}
  .add-btn:disabled{opacity:.4; cursor:not-allowed}

  /* ---------- Filters ---------- */
  .filters{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:0 2px 18px}
  .filters .f-label{font-size:14px; color:var(--muted); font-weight:600}
  .chip{border:1.5px solid var(--line); background:var(--surface); color:var(--muted); border-radius:99px; padding:7px 14px; font-size:14px; cursor:pointer; font-weight:600}
  .chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .chip.tag[aria-pressed="true"]{background:var(--go); border-color:var(--go)}
  .spacer{flex:1}
  .link-btn{border:none; background:none; color:var(--go-ink); font-weight:600; cursor:pointer; font-size:14px; padding:6px}
  .link-btn:hover{text-decoration:underline}

  /* ---------- Categories ---------- */
  .cat{margin-bottom:26px}
  .cat-head{display:flex; align-items:center; gap:11px; padding:0 2px 10px; margin-bottom:10px; border-bottom:3px solid var(--cat,#ccc)}
  .cat-dot{width:14px; height:14px; border-radius:5px; background:var(--cat,#ccc); flex:none}
  .cat-name{font-family:var(--display); font-size:24px; font-weight:600; color:var(--cat,#333)}
  .cat-left{margin-left:auto; font-size:13px; font-weight:700; color:#fff; background:var(--cat,#999); padding:3px 11px; border-radius:99px}
  .cat-done .cat-left{background:var(--go)}

  .task{display:flex; align-items:flex-start; gap:14px; padding:14px; background:var(--surface);
    border:1px solid var(--line-soft); border-left:5px solid var(--lo); border-radius:14px; margin-bottom:9px;
    transition:opacity .25s ease, background .2s ease; box-shadow:0 2px 8px rgba(80,60,30,.04)}
  .task[data-p="High"]{border-left-color:var(--hi)}
  .task[data-p="Medium"]{border-left-color:var(--med)}
  .task[data-p="Low"]{border-left-color:var(--lo)}
  .task.done{opacity:.5; background:#FCFBF9}
  .box{appearance:none; -webkit-appearance:none; flex:none; width:28px; height:28px; margin-top:1px;
    border:2.5px solid var(--line); border-radius:9px; cursor:pointer; background:var(--surface); position:relative; transition:.15s}
  .box:hover{border-color:var(--go)}
  .box:checked{background:var(--go); border-color:var(--go)}
  .box:checked::after{content:""; position:absolute; left:8px; top:3px; width:7px; height:13px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg)}
  .t-body{flex:1; min-width:0}
  .t-text{font-size:17px; font-weight:500; word-break:break-word}
  .task.done .t-text{text-decoration:line-through; color:var(--muted); font-weight:400}
  .t-meta{display:flex; gap:7px; flex-wrap:wrap; margin-top:7px; align-items:center}
  .pri-tag{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 9px; border-radius:99px}
  .pri-tag.High{color:#fff; background:var(--hi)}
  .pri-tag.Medium{color:#fff; background:var(--med)}
  .pri-tag.Low{color:#fff; background:var(--lo)}
  .t-tag{font-size:13px; color:var(--go-ink); background:#E4F3F1; padding:2px 10px; border-radius:99px; cursor:pointer; font-weight:500}
  .t-tag:hover{filter:brightness(.97)}
  .del{border:none; background:none; color:#C9CDD4; cursor:pointer; font-size:22px; line-height:1; padding:4px 6px; flex:none}
  .del:hover{color:var(--hi)}

  /* ---------- Sub-items ---------- */
  .sub-toggle{border:1.5px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:99px; padding:2px 11px; font-size:13px; cursor:pointer; font-weight:600; font-family:var(--ui)}
  .sub-toggle:hover{border-color:var(--go); color:var(--go-ink)}
  .sub-toggle.full{color:var(--go-ink); background:#E4F3F1; border-color:#CDE9E5}
  .subs{margin-top:11px; padding-left:13px; border-left:2px solid var(--line-soft)}
  .sub{display:flex; align-items:flex-start; gap:10px; padding:5px 0}
  .sub-box{appearance:none; -webkit-appearance:none; flex:none; width:18px; height:18px; margin-top:2px;
    border:2px solid var(--line); border-radius:6px; cursor:pointer; background:var(--surface); position:relative; transition:.15s}
  .sub-box:hover{border-color:var(--go)}
  .sub-box:checked{background:var(--go); border-color:var(--go)}
  .sub-box:checked::after{content:""; position:absolute; left:5px; top:1px; width:4px; height:9px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
  .sub-text{flex:1; min-width:0; font-size:15px; word-break:break-word; line-height:1.4}
  .sub.done .sub-text{text-decoration:line-through; color:var(--muted)}
  .sub-del{border:none; background:none; color:#D5D9DE; cursor:pointer; font-size:17px; line-height:1; padding:0 4px; flex:none}
  .sub-del:hover{color:var(--hi)}
  .sub-add{display:flex; gap:8px; margin-top:9px}
  .sub-add input{flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px; padding:7px 10px;
    outline:none; font-size:15px; background:var(--surface)}
  .sub-add input::placeholder{color:#AEB4BD}
  .sub-add button{border:none; background:var(--go); color:#fff; font-weight:600; cursor:pointer;
    border-radius:10px; padding:7px 14px; font-size:15px}

  .empty{text-align:center; padding:52px 20px; color:var(--muted)}
  .empty .big{font-family:var(--display); font-size:26px; color:var(--ink); margin-bottom:8px; font-weight:500}

  .mgr{padding:16px; margin-bottom:18px}
  .mgr h3{margin:0 0 12px; font-family:var(--display); font-size:19px; font-weight:600}
  .mgr-row{display:flex; gap:9px; align-items:center; margin-bottom:9px}
  .mgr-sw{width:20px; height:20px; border-radius:6px; flex:none; border:1px solid rgba(0,0,0,.08)}
  .mgr-row input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; outline:none; font-weight:500}
  .mgr-count{font-size:13px; color:var(--muted); flex:none; width:66px; text-align:right}
  .mgr-del{border:1.5px solid var(--line); background:var(--surface); color:var(--muted); border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px; font-weight:600}
  .mgr-del:disabled{opacity:.4; cursor:not-allowed}
  .mgr-add{display:flex; gap:9px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft)}
  .mgr-add input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; outline:none}

  :focus-visible{outline:3px solid var(--go); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-in">
      <div class="date" id="date"></div>
      <div class="tally">
        <span class="n" id="left-n">0</span>
        <span class="lbl" id="left-lbl">left</span>
      </div>
      <div class="meter"><span id="meter-fill"></span></div>
      <div class="meter-cap" id="meter-cap"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="card add">
      <div class="add-row">
        <input class="task-text" id="task-text" type="text" placeholder="What needs doing today?" autocomplete="off" aria-label="Task">
        <button class="add-btn" id="add-btn" disabled>Add</button>
      </div>
      <div class="meta-row">
        <div class="pri-seg" role="group" aria-label="Priority">
          <button type="button" data-p="High">High</button>
          <button type="button" data-p="Medium" aria-pressed="true">Med</button>
          <button type="button" data-p="Low">Low</button>
        </div>
        <select id="cat-select" aria-label="Category"></select>
        <input class="tag-input" id="tag-input" type="text" placeholder="tags, comma separated" autocomplete="off" aria-label="Tags">
      </div>
    </div>

    <div class="filters">
      <span class="f-label">Show</span>
      <select id="cat-filter" aria-label="Filter by category"></select>
      <span id="tag-filters"></span>
      <div class="spacer"></div>
      <button class="link-btn" id="clear-filter" hidden>Clear filter</button>
      <button class="link-btn" id="toggle-mgr">Areas</button>
    </div>

    <div class="card mgr" id="mgr" hidden></div>
    <main id="list"></main>
  </div>

<script>
(function(){
  "use strict";
  var PRANK={High:0,Medium:1,Low:2};
  var KEY="daybook:v4";
  var PALETTE=["#4F46E5","#0D9488","#EA7317","#DB2777","#2563EB","#059669","#7C3AED","#D97706","#0891B2","#BE123C"];

  var seedCats=[
    {name:"NSLS",             color:"#BE123C"},
    {name:"School",           color:"#4F46E5"},
    {name:"HavenSync Care",   color:"#0D9488"},
    {name:"The King's Ember", color:"#EA7317"},
    {name:"Personal",         color:"#DB2777"}
  ];
  var t0=Date.now();
  var seedTasks=[
    {text:"SNT #1 w/Rachel — Sun Aug 9, 2:00 PM Central in Florida (= 3 PM ET)", priority:"High", category:"NSLS", tags:["nsls","snt"]},
    {text:"SNT #2 w/Rachel — Sun Aug 16, 3:00 PM ET", priority:"High", category:"NSLS", tags:["nsls","snt"]},
    {text:"SNT #3 w/Rachel — Sun Aug 23, 3:00 PM ET", priority:"High", category:"NSLS", tags:["nsls","snt"]},
    {text:"Finish ALL Steps to Induction — by Aug 20", priority:"High", category:"NSLS", tags:["nsls","deadline"]},
    {text:"NSLS Virtual Induction Ceremony — Sept 10", priority:"Medium", category:"NSLS", tags:["nsls"]},
    {text:"Capstone cycle 1 — reading + start Marketplace Simulation (Aug 4–5, eve)", priority:"High", category:"School", tags:["capstone","wgu"]},
    {text:"WGU Capstone Orientation (C216/C218/C219) — join from portal (Aug 5, 1:00 PM ET)", priority:"High", category:"School", tags:["capstone","orientation"]},
    {text:"Marketplace Simulation orientation — laptop + wifi (Aug 8, 12:00 PM ET / 11 AM in FL)", priority:"High", category:"School", tags:["capstone","simulation"]},
    {text:"Capstone Task 2 — DUE Aug 19", priority:"High", category:"School", tags:["capstone","deadline"]},
    {text:"Capstone cycles 2 & 3 — done before Aug 31", priority:"Medium", category:"School", tags:["capstone","wgu"]},
    {text:"Open business bank account + sort insurance", priority:"High", category:"HavenSync Care", tags:["business"]},
    {text:"Set up 1 social channel (Facebook or Instagram) — after Florida", priority:"Low", category:"HavenSync Care", tags:["marketing"]},
    {text:"Publish \u201CFan into Flame\u201D — next Sun Aug 16 (biweekly)", priority:"Medium", category:"The King's Ember", tags:["substack","newsletter"]},
    {text:"Florida trip — Panama City (Aug 6–10)", priority:"Medium", category:"Personal", tags:["travel","florida"]}
  ].map(function(t,i){ t.id="seed"+i; t.done=false; t.created=t0+i; return t; });

  // ---- HavenSync launch checklist, added Sept 2026. Applied additively to saved state (see applyPatch). ----
  var PATCH_ID="2026-09-launch";
  var HS="HavenSync Care";
  var launchTasks=[
    {id:"p09-01", text:"IRS 147C letter — call the IRS Business line, 800-829-4933 (replaces the CP575; unblocks SAM and payer enrollment)", priority:"High", category:HS, tags:["foundation","dofirst"], items:[]},
    {id:"p09-02", text:"SAM.gov full registration — you have the UEI only right now", priority:"High", category:HS, tags:["foundation"], items:[
      "Complete the full registration",
      "Choose 'All Awards'",
      "Fix the DBA so it reads HavenSync Care, not HAVENSYNC HEALTH LLC"]},
    {id:"p09-03", text:"Confirm the bank is open — First Internet 'Do More Business Checking'", priority:"Medium", category:HS, tags:["foundation"], items:[
      "Confirm the account is live",
      "Set up simple bookkeeping so payer and tax records start clean"]},
    {id:"p09-04", text:"Workers' comp — required in Indiana with W-2 caregivers, must be in place before your first hire", priority:"High", category:HS, tags:["foundation","insurance"], items:[]},
    {id:"p09-05", text:"Fill the insurance gaps — call CM&F to add", priority:"High", category:HS, tags:["foundation","insurance"], items:[
      "Abuse and molestation coverage",
      "Hired and non-owned auto",
      "Fidelity bond"]},
    {id:"p09-06", text:"LifeStream — meet Jeff, Mon Sept 28 (beat the Sept 30 contract cutoff)", priority:"High", category:HS, tags:["revenue","lifestream","meeting","dofirst"], items:[
      "Can I still get contracted before the Sept 30 FY2026 cutoff, or is it the Oct 1 cycle? Any mid-cycle add?",
      "LifeStream is non-waiver only now (CHOICE, SSBG, Title III) since PathWays took the waiver clients — is that my lane, and what referral volume flows through it now?",
      "How do new providers get a first referral — pick-list, rotation, or care-manager choice? What gets me to the top?",
      "What does LifeStream pay per hour/unit, and what are the payment terms and EVV requirements?",
      "What does Tony need in the packet, and will you walk it in for me?",
      "Which Madison County discharge planners / care managers send the most volume?",
      "You know CenterWell — the VA is moving my brother-in-law off them to us. How do those transitions tend to go?",
      "Bring: business cards",
      "Bring: brochure",
      "Bring: rate sheet",
      "Bring: PSA license number"]},
    {id:"p09-07", text:"Get the non-waiver packet from Tony Suttle — tsuttle@lifestreaminc.org", priority:"High", category:HS, tags:["revenue","lifestream"], items:[]},
    {id:"p09-08", text:"Submit the LifeStream packet — before Sept 30, or confirm you're queued for the Oct 1 (FY2027) cycle", priority:"High", category:HS, tags:["revenue","lifestream","deadline"], items:[]},
    {id:"p09-09", text:"VA Community Care Network — call Optum, Region 2: 844-839-6108", priority:"High", category:HS, tags:["revenue","va","dofirst"], items:[
      "Enroll at vacommunitycare.com/provider",
      "Give them your NPI: 1023928017",
      "Tie the application to your brother-in-law's case — the VA nurse already requested your provider number",
      "Ask about a Veterans Care Agreement (VCA) with the Indianapolis VAMC as a faster parallel path"]},
    {id:"p09-10", text:"Indiana Medicaid PathWays — Step 1: OMPP certification at omppproviders.fssa.in.gov", priority:"Medium", category:HS, tags:["revenue","medicaid"], items:[
      "Have every document ready BEFORE you start",
      "Once you start, you have 30 days to fully submit"]},
    {id:"p09-11", text:"IHCP enrollment — Step 2, 800-457-4584", priority:"Medium", category:HS, tags:["revenue","medicaid"], items:[]},
    {id:"p09-12", text:"Contract separately with the PathWays plans — Step 3", priority:"Medium", category:HS, tags:["revenue","medicaid"], items:[
      "Anthem",
      "Humana",
      "UnitedHealthcare"]},
    {id:"p09-13", text:"Set up Sandata EVV (~$450/yr) — attestation required at enrollment", priority:"Medium", category:HS, tags:["revenue","medicaid"], items:[]},
    {id:"p09-14", text:"Send the Bankable intro email (drafted)", priority:"High", category:HS, tags:["capital","dofirst"], items:[]},
    {id:"p09-15", text:"Bankable meeting — what to bring", priority:"Medium", category:HS, tags:["capital"], items:[
      "PSA license",
      "Articles of Organization",
      "EIN letter",
      "Operating agreement",
      "Simple use-of-funds summary",
      "Don't name a loan amount first — let them shape it"]},
    {id:"p09-16", text:"Indiana legal review — intake packet + service agreement before first use", priority:"High", category:HS, tags:["privatepay","legal"], items:[]},
    {id:"p09-17", text:"Finalize the referral flyer", priority:"Medium", category:HS, tags:["privatepay","marketing"], items:[]},
    {id:"p09-18", text:"Outreach visits", priority:"Medium", category:HS, tags:["privatepay","marketing"], items:[
      "Rehab centers",
      "PT offices",
      "Senior centers",
      "Discharge planners"]},
    {id:"p09-19", text:"Land first 3 private-pay clients", priority:"Medium", category:HS, tags:["privatepay"], items:[]},
    {id:"p09-20", text:"Review and update the company manual — starter list, edit to match your manual", priority:"High", category:HS, tags:["manual","policies"], items:[
      "Mission, services offered, and the non-medical scope line",
      "Client rights and responsibilities",
      "Intake, assessment, and care plan process",
      "Caregiver hiring — background checks, references, verification",
      "Caregiver training and annual competency",
      "Scheduling, call-offs, and no-show coverage",
      "EVV procedure (Sandata)",
      "Incident reporting and change-in-condition escalation",
      "HIPAA and client privacy",
      "Infection control and universal precautions",
      "Medication reminders — what caregivers may and may not do",
      "Transportation policy and the Transportation Addendum",
      "Abuse and neglect reporting — Indiana mandatory reporting",
      "Complaint and grievance procedure",
      "Employee handbook — pay, overtime, PTO, discipline, termination",
      "Emergency and disaster plan",
      "Record retention and destruction"]},
    {id:"p09-21", text:"Indiana WBE — IDOA Division of Supplier Diversity (free)", priority:"Low", category:HS, tags:["certs"], items:[
      "Get your Bidder Registration Number first"]},
    {id:"p09-22", text:"SBA WOSB — MySBA Certifications (free)", priority:"Low", category:HS, tags:["certs"], items:[
      "Needs the full SAM registration done first"]},
    {id:"p09-23", text:"Park HUBZone and 8(a) for later", priority:"Low", category:HS, tags:["certs"], items:[]}
  ].map(function(t,i){
    t.done=false; t.created=t0+100+i;
    t.items=t.items.map(function(s,j){ return {id:t.id+"-"+(j+1), text:s, done:false}; });
    return t;
  });

  function cloneTask(t){
    return {id:t.id, text:t.text, done:t.done, priority:t.priority, category:t.category,
      tags:t.tags.slice(), created:t.created,
      items:(t.items||[]).map(function(s){ return {id:s.id, text:s.text, done:s.done}; })};
  }

  var state={ categories:seedCats.slice(), tasks:seedTasks.concat(launchTasks.map(cloneTask)) };
  var draftPriority="Medium";
  var filter={category:"all", tag:null};
  var mgrOpen=false;
  var expanded={};      // task id -> sub-item list open? view state, not persisted
  var focusSub=null;    // task id whose add-item input should regain focus after render

  // ---- persistence: localStorage first (works when hosted), then artifact storage, then memory ----
  function load(){
    try{ var raw=localStorage.getItem(KEY); if(raw!==null) return Promise.resolve(JSON.parse(raw)); }catch(e){}
    if(window.storage&&window.storage.get){
      return window.storage.get(KEY).then(function(r){return r&&r.value?JSON.parse(r.value):null;}).catch(function(){return null;});
    }
    return Promise.resolve(null);
  }
  function save(){
    var s=JSON.stringify(state);
    try{ localStorage.setItem(KEY,s); return; }catch(e){}
    if(window.storage&&window.storage.set){ try{ window.storage.set(KEY,s,false); }catch(e){} }
  }
  function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"t"+Date.now()+Math.random().toString(36).slice(2,7); }

  var $=function(id){return document.getElementById(id);};
  var elDate=$("date"),elLeftN=$("left-n"),elLeftLbl=$("left-lbl"),elFill=$("meter-fill"),elCap=$("meter-cap"),
      elText=$("task-text"),elAdd=$("add-btn"),elCatSelect=$("cat-select"),elTagInput=$("tag-input"),
      elCatFilter=$("cat-filter"),elTagFilters=$("tag-filters"),elClearFilter=$("clear-filter"),
      elToggleMgr=$("toggle-mgr"),elMgr=$("mgr"),elList=$("list"),priSeg=document.querySelector(".pri-seg");

  function colorFor(name){ for(var i=0;i<state.categories.length;i++){ if(state.categories[i].name===name) return state.categories[i].color; } return "#9AA3B0"; }
  function catNames(){ return state.categories.map(function(c){return c.name;}); }
  function nextColor(){ for(var i=0;i<PALETTE.length;i++){ var used=false; for(var j=0;j<state.categories.length;j++){ if(state.categories[j].color===PALETTE[i]) used=true; } if(!used) return PALETTE[i]; } return PALETTE[state.categories.length%PALETTE.length]; }
  function parseTags(str){ return str.split(",").map(function(s){return s.trim().replace(/^#/,"");}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}); }
  function allTags(){ var set={}; state.tasks.forEach(function(t){t.tags.forEach(function(g){set[g]=1;});}); return Object.keys(set).sort(); }
  function esc(s){ return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

  function render(){
    var now=new Date();
    elDate.textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    var total=state.tasks.length, done=state.tasks.filter(function(t){return t.done;}).length, left=total-done;
    elLeftN.textContent=left;
    elLeftLbl.classList.toggle("allclear", total>0&&left===0);
    elLeftLbl.textContent = total===0?"to plan":(left===0?"all clear":"left");
    elFill.style.width=(total?(done/total*100):0)+"%";
    elCap.textContent=total?(done+" of "+total+" done today"):"Nothing scheduled yet.";

    syncCatSelect(); syncCatFilter(); syncTagFilters(); if(mgrOpen) renderMgr();

    elList.innerHTML="";
    if(total===0){ elList.innerHTML='<div class="empty"><div class="big">A clean page.</div>Add your first task above to shape the day.</div>'; return; }

    var visible=state.tasks.filter(function(t){
      if(filter.category!=="all"&&t.category!==filter.category) return false;
      if(filter.tag&&t.tags.indexOf(filter.tag)<0) return false;
      return true;
    });
    if(visible.length===0){ elList.innerHTML='<div class="empty"><div class="big">Nothing matches that filter.</div>Clear it to see the rest of your day.</div>'; return; }

    var order=catNames();
    visible.forEach(function(t){ if(order.indexOf(t.category)<0) order.push(t.category); });
    order.forEach(function(cat){
      var items=visible.filter(function(t){return t.category===cat;});
      if(!items.length) return;
      items.sort(function(a,b){
        if(PRANK[a.priority]!==PRANK[b.priority]) return PRANK[a.priority]-PRANK[b.priority];
        return a.created-b.created;
      });
      var leftInCat=items.filter(function(t){return !t.done;}).length;
      var col=colorFor(cat);
      var sec=document.createElement("section");
      sec.className="cat"+(leftInCat===0?" cat-done":"");
      sec.style.setProperty("--cat",col);
      var head=document.createElement("div"); head.className="cat-head";
      head.innerHTML='<span class="cat-dot"></span><span class="cat-name">'+esc(cat)+'</span>'+
        '<span class="cat-left">'+(leftInCat===0?"done":leftInCat+" left")+'</span>';
      sec.appendChild(head);
      items.forEach(function(t){ sec.appendChild(taskEl(t)); });
      elList.appendChild(sec);
    });
    restoreSubFocus();
  }

  function restoreSubFocus(){
    if(!focusSub) return;
    var f=elList.querySelector('[data-sub-add="'+focusSub+'"]'); focusSub=null;
    if(f) f.focus();
  }

  function taskEl(t){
    var row=document.createElement("div");
    row.className="task"+(t.done?" done":""); row.setAttribute("data-p",t.priority);
    var box=document.createElement("input");
    box.type="checkbox"; box.className="box"; box.checked=t.done;
    box.setAttribute("aria-label",(t.done?"Mark not done: ":"Mark done: ")+t.text);
    box.addEventListener("change",function(){ t.done=box.checked; save(); render(); });
    var body=document.createElement("div"); body.className="t-body";
    var txt=document.createElement("div"); txt.className="t-text"; txt.textContent=t.text;
    var meta=document.createElement("div"); meta.className="t-meta";
    var pri=document.createElement("span"); pri.className="pri-tag "+t.priority; pri.textContent=t.priority; meta.appendChild(pri);
    t.tags.forEach(function(g){
      var tag=document.createElement("span"); tag.className="t-tag"; tag.textContent="#"+g; tag.title="Filter by #"+g;
      tag.addEventListener("click",function(){ filter.tag=g; render(); }); meta.appendChild(tag);
    });
    var items=t.items||[];
    var doneN=items.filter(function(s){return s.done;}).length;
    var tog=document.createElement("button"); tog.type="button"; tog.className="sub-toggle";
    if(items.length){
      tog.textContent=(expanded[t.id]?"▾ ":"▸ ")+doneN+"/"+items.length;
      if(doneN===items.length) tog.className+=" full";
      tog.title=(expanded[t.id]?"Hide":"Show")+" list for: "+t.text;
    }else{
      tog.textContent=expanded[t.id]?"▾ list":"+ list";
      tog.title="Start a list for: "+t.text;
    }
    tog.setAttribute("aria-expanded",expanded[t.id]?"true":"false");
    tog.addEventListener("click",function(){ expanded[t.id]=!expanded[t.id]; render(); });
    meta.appendChild(tog);

    body.appendChild(txt); body.appendChild(meta);
    if(expanded[t.id]) body.appendChild(subsEl(t));
    var del=document.createElement("button"); del.className="del"; del.innerHTML="&times;"; del.setAttribute("aria-label","Delete task: "+t.text);
    del.addEventListener("click",function(){ state.tasks=state.tasks.filter(function(x){return x.id!==t.id;}); save(); render(); });
    row.appendChild(box); row.appendChild(body); row.appendChild(del);
    return row;
  }

  function subsEl(t){
    if(!t.items) t.items=[];
    var wrap=document.createElement("div"); wrap.className="subs";
    t.items.forEach(function(it){
      var row=document.createElement("div"); row.className="sub"+(it.done?" done":"");
      var cb=document.createElement("input");
      cb.type="checkbox"; cb.className="sub-box"; cb.checked=it.done;
      cb.setAttribute("aria-label",(it.done?"Mark not done: ":"Mark done: ")+it.text);
      cb.addEventListener("change",function(){ it.done=cb.checked; save(); render(); });
      var tx=document.createElement("span"); tx.className="sub-text"; tx.textContent=it.text;
      var rm=document.createElement("button"); rm.className="sub-del"; rm.innerHTML="&times;";
      rm.setAttribute("aria-label","Remove: "+it.text);
      rm.addEventListener("click",function(){
        t.items=t.items.filter(function(x){return x.id!==it.id;}); save(); render(); });
      row.appendChild(cb); row.appendChild(tx); row.appendChild(rm); wrap.appendChild(row);
    });
    var add=document.createElement("div"); add.className="sub-add";
    var ai=document.createElement("input"); ai.type="text"; ai.autocomplete="off";
    ai.placeholder="Add a question or item"; ai.setAttribute("data-sub-add",t.id);
    ai.setAttribute("aria-label","Add an item to: "+t.text);
    var ab=document.createElement("button"); ab.type="button"; ab.textContent="Add";
    function doAdd(){
      var v=ai.value.trim(); if(!v) return;
      t.items.push({id:uid(),text:v,done:false}); ai.value=""; focusSub=t.id; save(); render();
    }
    ab.addEventListener("click",doAdd);
    ai.addEventListener("keydown",function(e){ if(e.key==="Enter") doAdd(); });
    add.appendChild(ai); add.appendChild(ab); wrap.appendChild(add);
    return wrap;
  }

  function syncCatSelect(){ var cur=elCatSelect.value; elCatSelect.innerHTML="";
    state.categories.forEach(function(c){ var o=document.createElement("option"); o.value=c.name; o.textContent=c.name; elCatSelect.appendChild(o); });
    if(catNames().indexOf(cur)>=0) elCatSelect.value=cur; }
  function syncCatFilter(){ var cur=filter.category; elCatFilter.innerHTML="";
    var all=document.createElement("option"); all.value="all"; all.textContent="All areas"; elCatFilter.appendChild(all);
    state.categories.forEach(function(c){ var o=document.createElement("option"); o.value=c.name; o.textContent=c.name; elCatFilter.appendChild(o); });
    elCatFilter.value=(cur==="all"||catNames().indexOf(cur)>=0)?cur:"all"; updateClearBtn(); }
  function syncTagFilters(){ elTagFilters.innerHTML="";
    allTags().forEach(function(g){ var b=document.createElement("button"); b.className="chip tag"; b.textContent="#"+g;
      b.setAttribute("aria-pressed",filter.tag===g?"true":"false");
      b.addEventListener("click",function(){ filter.tag=(filter.tag===g)?null:g; render(); }); elTagFilters.appendChild(b); });
    updateClearBtn(); }
  function updateClearBtn(){ elClearFilter.hidden=(filter.category==="all"&&!filter.tag); }

  function renderMgr(){
    elMgr.innerHTML=""; var h=document.createElement("h3"); h.textContent="Your areas"; elMgr.appendChild(h);
    state.categories.forEach(function(c,i){
      var used=state.tasks.filter(function(t){return t.category===c.name;}).length;
      var row=document.createElement("div"); row.className="mgr-row";
      var sw=document.createElement("span"); sw.className="mgr-sw"; sw.style.background=c.color;
      var inp=document.createElement("input"); inp.value=c.name;
      inp.addEventListener("change",function(){
        var nn=inp.value.trim(); if(!nn){inp.value=c.name;return;}
        if(nn!==c.name&&catNames().indexOf(nn)>=0){inp.value=c.name;return;}
        var old=state.categories[i].name; state.categories[i].name=nn;
        state.tasks.forEach(function(t){ if(t.category===old) t.category=nn; });
        if(filter.category===old) filter.category=nn; save(); render();
      });
      var cnt=document.createElement("span"); cnt.className="mgr-count"; cnt.textContent=used?used+(used===1?" task":" tasks"):"empty";
      var del=document.createElement("button"); del.className="mgr-del"; del.textContent="Remove";
      del.disabled=used>0||state.categories.length<=1; del.title=used>0?"Move or finish its tasks first":"Remove area";
      del.addEventListener("click",function(){ state.categories.splice(i,1); if(filter.category===c.name) filter.category="all"; save(); render(); });
      row.appendChild(sw); row.appendChild(inp); row.appendChild(cnt); row.appendChild(del); elMgr.appendChild(row);
    });
    var add=document.createElement("div"); add.className="mgr-add";
    var ai=document.createElement("input"); ai.placeholder="Add an area";
    var ab=document.createElement("button"); ab.className="add-btn"; ab.textContent="Add";
    function doAdd(){ var nn=ai.value.trim(); if(!nn||catNames().indexOf(nn)>=0){ai.value="";return;}
      state.categories.push({name:nn,color:nextColor()}); ai.value=""; save(); render(); }
    ab.addEventListener("click",doAdd); ai.addEventListener("keydown",function(e){ if(e.key==="Enter") doAdd(); });
    add.appendChild(ai); add.appendChild(ab); elMgr.appendChild(add);
  }

  function ensureCategory(name){
    if(catNames().indexOf(name)<0) state.categories.push({name:name,color:nextColor()});
  }

  // Additive: appends any launch task not already present, once. Recording PATCH_ID means a task
  // the user deletes stays deleted instead of reappearing on the next load.
  function applyPatch(){
    if(!state.patches) state.patches=[];
    if(state.patches.indexOf(PATCH_ID)>=0) return false;
    var have={}; state.tasks.forEach(function(t){ have[t.id]=1; });
    launchTasks.forEach(function(t){ if(!have[t.id]) state.tasks.push(cloneTask(t)); });
    state.patches.push(PATCH_ID);
    return true;
  }

  function addTask(){
    var text=elText.value.trim(); if(!text) return;
    var cat=elCatSelect.value||(state.categories[0]&&state.categories[0].name)||"Personal";
    state.tasks.push({id:uid(),text:text,done:false,priority:draftPriority,category:cat,tags:parseTags(elTagInput.value),created:Date.now()});
    elText.value=""; elTagInput.value=""; elAdd.disabled=true; save(); render(); elText.focus();
  }

  elText.addEventListener("input",function(){ elAdd.disabled=elText.value.trim()===""; });
  elText.addEventListener("keydown",function(e){ if(e.key==="Enter") addTask(); });
  elTagInput.addEventListener("keydown",function(e){ if(e.key==="Enter") addTask(); });
  elAdd.addEventListener("click",addTask);
  priSeg.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; draftPriority=b.getAttribute("data-p");
    Array.prototype.forEach.call(priSeg.querySelectorAll("button"),function(x){ x.setAttribute("aria-pressed",x===b?"true":"false"); }); });
  elCatFilter.addEventListener("change",function(){ filter.category=elCatFilter.value; render(); });
  elClearFilter.addEventListener("click",function(){ filter.category="all"; filter.tag=null; render(); });
  elToggleMgr.addEventListener("click",function(){ mgrOpen=!mgrOpen; elMgr.hidden=!mgrOpen; elToggleMgr.textContent=mgrOpen?"Done":"Areas"; if(mgrOpen) renderMgr(); });

  load().then(function(saved){
    if(saved&&saved.categories&&saved.tasks) state=saved;
    ensureCategory(HS);
    if(applyPatch()) save();
    render();
  });
})();
</script>
</body>
</html>
